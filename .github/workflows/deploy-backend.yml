name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - backend  

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x  # Ensure .NET 9 is installed
          include-prerelease: true  # Allow preview versions if needed

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Backend
        run: dotnet build --configuration Release --no-restore

      - name: Run Backend Tests (xUnit)
        run: dotnet test --logger trx --results-directory TestResults

      - name: Upload Backend Test Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x
          include-prerelease: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish Backend
        run: dotnet publish -c Release -o out

      - name: Package & Upload to S3
        run: |
          cd out
          zip -r backend.zip .
          aws s3 cp backend.zip s3://${{ secrets.S3_BUCKET }}/backend.zip

      - name: Trigger AWS CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=backend.zip,bundleType=zip
