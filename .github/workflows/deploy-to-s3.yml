name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - frontend  # Runs on push to the frontend branch

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          rm -rf node_modules
          rm package-lock.json
          npm install

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Run Jest Tests
        run: npm test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: results/

  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: build-and-test  # Ensures tests pass before deployment
    environment: 
      name: production  # Requires manual approval
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Clean S3 Bucket
        run: |
          aws s3 rm s3://searchproject-frontend --recursive

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://searchproject-frontend \
          --exclude "node_modules/*" \
          --exclude "coverage/*" \
          --exclude "results/*" \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "*.test.mjs" \
          --exclude "package.json" \
          --exclude "package-lock.json" \
          --exclude "babel.config.mjs" \
          --exclude "jest.config.mjs" \
          --exclude "README.md" \
          --exclude ".*"  # Exclude dotfiles (if necessary)
